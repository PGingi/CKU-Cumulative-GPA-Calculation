<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가톨릭관동대학교 졸업 학점 계산기 & 성적 엑셀 변환기</title>
    <!-- SheetJS (엑셀 다운로드용 라이브러리) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- PDF.js (PDF 텍스트 추출용 라이브러리) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
        // PDF.js worker 설정
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
    <style>
        :root {
            --primary: #003366;
            --primary-hover: #002244;
            --secondary: #4a90e2;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --border: #e1e4e8;
            --text: #2c3e50;
            --text-light: #7f8c8d;
            --success: #2b8a3e;
            --success-bg: #ebfbee;
            --danger: #c92a2a;
            --danger-bg: #fff5f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 45px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            color: var(--primary);
            font-size: 26px;
            margin-bottom: 8px;
            font-weight: 800;
        }

        header p {
            color: var(--text-light);
            font-size: 14px;
        }

        .step-section {
            background: #fafbfc;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .form-row:last-child {
            margin-bottom: 0;
        }

        .form-row label.row-title {
            font-weight: 600;
            font-size: 14px;
            flex: 1.2;
            color: #4a5568;
        }

        .form-row .input-area {
            flex: 2.8;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        select {
            width: 100%;
            padding: 11px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            transition: all 0.2s;
            background: #fff;
            color: var(--text);
        }

        select:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }

        .radio-group, .checkbox-group {
            display: flex;
            gap: 20px;
            font-size: 14px;
            cursor: pointer;
            align-items: center;
            white-space: nowrap;
        }

        .sub-input-box {
            background-color: #fff;
            padding: 18px;
            border-radius: 10px;
            margin-top: 10px;
            margin-bottom: 15px;
            display: none;
            border: 1px dashed var(--border);
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 14px;
            border: 1px solid var(--border);
            border-radius: 10px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            outline: none;
            background: #fff;
            transition: all 0.2s;
        }

        textarea:focus {
            border-color: var(--secondary);
            box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.15);
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 10px;
        }

        .btn-action {
            flex: 2;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 15px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        .btn-action:hover {
            background-color: var(--primary-hover);
        }

        .btn-excel {
            flex: 1;
            background-color: #217346;
            color: white;
            border: none;
            padding: 15px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 10px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
            display: none; /* 결과 나올 때 표시 */
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-excel:hover {
            background-color: #1a5c38;
        }

        .btn-action:active, .btn-excel:active {
            transform: scale(0.98);
        }

        /* 결과 리포트 디자인 개선 */
        .result-container {
            margin-top: 35px;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 30px;
            display: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.02);
        }

        .result-container h3 {
            font-size: 18px;
            color: var(--primary);
            margin-bottom: 20px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 10px;
        }

        .summary-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-top: 15px;
        }

        .summary-card.full-width {
            grid-column: span 2;
        }

        .summary-card {
            background: #fafbfc;
            padding: 18px;
            border-radius: 12px;
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .summary-card.pass { 
            background-color: var(--success-bg);
            border-color: #b2f2bb;
            border-left: 6px solid var(--success); 
        }
        .summary-card.fail { 
            background-color: var(--danger-bg);
            border-color: #ffc9c9;
            border-left: 6px solid var(--danger); 
        }

        .status-badge {
            font-weight: 700;
            font-size: 13px;
            float: right;
            padding: 3px 8px;
            border-radius: 6px;
        }
        .pass-text { color: var(--success); }
        .fail-text { color: var(--danger); }

        .requirement-box {
            margin-top: 25px;
            background: #fafbfc;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border);
        }

        .requirement-list {
            margin: 10px 0 0 20px; 
            font-size: 14px; 
            line-height: 1.8;
            color: #4a5568;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>가톨릭관동대학교 졸업 학점 계산기</h1>
        <p>스마트 이수 요건 시뮬레이터 및 성적 엑셀 변환기</p>
    </header>

    <!-- 섹션 1: 단과대학 및 학적 정보 설정 -->
    <div class="step-section">
        <div class="section-title">⚙️ 1. 단과대학 및 학적 정보 설정</div>

        <div class="form-row">
            <label class="row-title" for="collegeSelect">지원 단과대학</label>
            <div class="input-area">
                <select id="collegeSelect">
                    <option value="edu">사범대학</option>
                    <option value="trinity">트리니티융합대학 (일반대학)</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <label class="row-title" for="admissionYear">입학 학번 (입학 연도)</label>
            <div class="input-area">
                <select id="admissionYear">
                    <option value="22">22학번</option>
                    <option value="23">23학번</option>
                    <option value="24">24학번</option>
                    <option value="25">25학번</option>
                    <option value="26" selected>26학번</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <label class="row-title" for="currentGrade">현재 학년 (2026년 기준)</label>
            <div class="input-area">
                <select id="currentGrade">
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3">3학년</option>
                    <option value="4" selected>4학년</option>
                </select>
            </div>
        </div>

        <div class="form-row">
            <label class="row-title">복학 유무</label>
            <div class="input-area">
                <div class="radio-group">
                    <label><input type="radio" name="leaveStatus" value="no" checked onclick="toggleLeaveOptions(false)"> 아니오</label>
                    <label><input type="radio" name="leaveStatus" value="yes" onclick="toggleLeaveOptions(true)"> 예</label>
                </div>
            </div>
        </div>

        <div id="leaveOptionsBox" class="sub-input-box">
            <div class="form-row">
                <label class="row-title" style="font-size: 13px;" for="leaveYearSelect">복학 연도</label>
                <div class="input-area">
                    <select id="leaveYearSelect">
                        <option value="2022">2022년</option>
                        <option value="2023">2023년</option>
                        <option value="2024">2024년</option>
                        <option value="2025">2025년</option>
                        <option value="2026" selected>2026년</option>
                    </select>
                </div>
            </div>
            <div class="form-row" style="margin-bottom: 0;">
                <label class="row-title" style="font-size: 13px;" for="returnGrade">복학 후 적용 학년</label>
                <div class="input-area">
                    <select id="returnGrade">
                        <option value="1">1학년</option>
                        <option value="2">2학년</option>
                        <option value="3">3학년</option>
                        <option value="4">4학년</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="form-row">
            <label class="row-title">소단위전공 이수</label>
            <div class="input-area">
                <label class="checkbox-group"><input type="checkbox" id="subMajorCheck"> 필수 이수 과정 포함 (선택 시 활성화)</label>
            </div>
        </div>

        <div class="form-row" id="teachingRow">
            <label class="row-title">교직 이수 여부</label>
            <div class="input-area">
                <label class="checkbox-group"><input type="checkbox" id="teachingCheck"> 교직 과정 이수 (7과목 / 21학점 이상)</label>
            </div>
        </div>

        <div class="form-row">
            <label class="row-title">졸업 논문</label>
            <div class="input-area">
                <div class="radio-group">
                    <label><input type="radio" name="thesisStatus" value="done"> 제출 완료 (또는 면제)</label>
                    <label><input type="radio" name="thesisStatus" value="none" checked> 미제출</label>
                </div>
            </div>
        </div>
    </div>

    <!-- 섹션 2: 성적 데이터 입력 -->
    <div class="step-section">
        <div class="section-title">📋2. 성적 데이터 입력 (직접 입력 또는 파일 업로드)</div>
        <p style="font-size: 13px; color: var(--text-light); margin-bottom: 12px;">
            종합정보시스템 성적 조회 화면의 전체 내용을 복사하여 붙여넣거나, 성적 엑셀/PDF 파일을 업로드해주세요. ('N' 등급은 자동으로 제외됩니다)
        </p>

        <!-- ★ 파일 업로드 입력창 추가 -->
        <div class="form-row" style="margin-bottom: 15px;">
            <label class="row-title" for="gradeFile">성적 파일 업로드</label>
            <div class="input-area">
            <input type="file" id="gradeFile" accept=".xlsx, .xls, .pdf" onchange="handleFileUpload(event)" style="font-size: 13px; width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 8px; background: #fff;">
            </div>
        </div>

        <textarea id="rawGrades" placeholder="예시:
전공필수 소프트웨어공학 3 A+
소단위전공 빅데이터기초 3 A0
교양필수 대학글쓰기 2 B0"></textarea>

        <div class="btn-group">
            <button class="btn-action" onclick="calculateGraduation()">📊 졸업 요건 충족 여부 계산하기</button>
            <button id="excelBtn" class="btn-excel" onclick="exportToExcel()">성적 엑셀 다운로드</button>
        </div>
    </div>

    <!-- 결과 출력 영역 -->
    <div id="resultBox" class="result-container">
        <h3>📊 졸업 요건 충족 판정 리포트</h3>
        <div id="resultContent"></div>
    </div>
</div>

<script>
    let globalParsedRows = []; // 엑셀 다운로드용 전역 데이터 저장소

    function toggleLeaveOptions(isYes) {
        const box = document.getElementById('leaveOptionsBox');
        box.style.display = isYes ? 'block' : 'none';
    }

    // ★ [추가] 파일 업로드 통합 처리 함수
    async function handleFileUpload(event) {
        const file = event.target.files[0];
        if (!file) return;

        const fileName = file.name.toLowerCase();
        const rawGradesArea = document.getElementById('rawGrades');

        if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
            // 엑셀 파일 처리 (SheetJS 활용)
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const data = new Uint8Array(e.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    
                    const textData = XLSX.utils.sheet_to_csv(worksheet, { FS: "\t" });
                    rawGradesArea.value = textData;
                    alert('엑셀 파일이 성공적으로 로드되었습니다! "졸업 요건 충족 여부 계산하기"를 눌러주세요.');
                } catch (err) {
                    console.error("엑셀 파일 읽기 오류:", err);
                    alert("엑셀 파일을 읽는 중 오류가 발생했습니다.");
                }
            };
            reader.readAsArrayBuffer(file);

        } else if (fileName.endsWith('.pdf')) {
            // PDF 파일 처리 (PDF.js 활용)
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const typedarray = new Uint8Array(e.target.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let fullText = "";

                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        const pageText = textContent.items.map(item => item.str).join("\n");
                        fullText += pageText + "\n";
                    }

                    rawGradesArea.value = fullText;
                    alert('PDF 파일에서 텍스트가 성공적으로 추출되었습니다! "졸업 요건 충족 여부 계산하기"를 눌러주세요.');
                } catch (err) {
                    console.error("PDF 파일 읽기 오류:", err);
                    alert("PDF 파일을 읽는 중 오류가 발생했습니다. (텍스트 기반 PDF인지 확인해주세요)");
                }
            };
            reader.readAsArrayBuffer(file);
        } else {
            alert("지원하지 않는 파일 형식입니다. 엑셀(.xlsx, .xls) 또는 PDF(.pdf) 파일을 업로드해주세요.");
        }
    }

    function calculateGraduation() {
        const college = document.getElementById('collegeSelect').value;
        const admissionYear = document.getElementById('admissionYear').value;
        
        const isLeave = document.querySelector('input[name="leaveStatus"]:checked').value === 'yes';
        const targetGrade = isLeave ? parseInt(document.getElementById('returnGrade').value) : parseInt(document.getElementById('currentGrade').value);

        const isSubMajorRequired = document.getElementById('subMajorCheck').checked;
        const isTeaching = document.getElementById('teachingCheck').checked;
        const isThesisDone = document.querySelector('input[name="thesisStatus"]:checked').value === 'done';
        const rawData = document.getElementById('rawGrades').value;

        if (!rawData.trim()) {
            alert('성적 데이터를 입력해주세요!');
            return;
        }

        let totalCredits = 0;
        let majorCredits = 0;
        let subMajorCredits = 0;
        let generalCredits = 0;
        let teachingCredits = 0;
        let electiveCredits = 0;
        
        globalParsedRows = []; // 초기화

        const lines = rawData.split('\n');
        lines.forEach(line => {
            const trimmedLine = line.trim();
            if (!trimmedLine) return;

            // ★ [핵심 해결책] 
            // 엑셀 파일 상단의 학적 정보, 요약표, 헤더 등을 완전히 걸러내고, 
            // 오직 '2022/1', '2025/2' 같은 이수학기 패턴으로 시작하는 실제 성적 행만 파싱합니다!
            const semesterPattern = /^\d{4}\/[1-2]/;
            const cols = trimmedLine.split(/\s+/).filter(c => c.length > 0);

            if (cols.length === 0 || !semesterPattern.test(cols[0])) {
                return; // 성적 데이터 행이 아니면 계산에서 제외하고 건너뜀
            }

            if (cols.includes('N')) {
                return; // Non-Pass 제외
            }

            let credit = 0;
            cols.forEach(col => {
                let num = parseFloat(col);
                if (!isNaN(num) && (num === 0.5 || (num >= 1 && num <= 6 && Number.isInteger(num)))) {
                    credit = num;
                }
            });

            if (credit == 0 && trimmedLine.includes('0.5')) {
                credit = 0.5;
            }

            let type = '일반선택';
            if (line.includes('소단위전공')) {
                type = '소단위전공';
            } else if (line.includes('교양')) {
                type = '교양';
            } else if (line.includes('교직')) {
                type = '교직';
            } else if (line.includes('전공')) {
                type = '전공';
            }

            if (credit > 0) {
                totalCredits += credit;

                if (type === '소단위전공') subMajorCredits += credit;
                else if (type === '전공') majorCredits += credit;
                else if (type === '교양') generalCredits += credit;
                else if (type === '교직') teachingCredits += credit;
                else electiveCredits += credit;

                // 엑셀용 행 데이터 구조화 저장 (원본 텍스트에서 과목명 추출 추정)
                globalParsedRows.push({
                    '이수구분': type,
                    '과목정보': line.trim(),
                    '인정학점': credit
                });
            }
        });

        const targetTotal = 130;
        let targetMajor = (college === 'edu') ? (targetGrade <= 3 ? 58 : 69) : 40;
        let targetGeneral = 36;

        if (admissionYear === '24') targetGeneral = 32;
        else if (admissionYear === '25' || admissionYear === '26') targetGeneral = 28;

        const targetSubMajor = 9;

        const isTotalPass = totalCredits >= targetTotal;
        const isMajorPass = majorCredits >= targetMajor;
        const isGeneralPass = generalCredits >= targetGeneral;
        const isSubMajorPass = !isSubMajorRequired || (subMajorCredits >= targetSubMajor);
        const teachingPass = !isTeaching || (teachingCredits >= 21);

        let summaryCardsHTML = `
            <div class="summary-card full-width ${isTotalPass ? 'pass' : 'fail'}">
                <strong>총 이수 학점</strong>
                <span class="status-badge ${isTotalPass ? 'pass-text' : 'fail-text'}">${isTotalPass ? '✔ 충족' : '❌ 부족'}</span>
                <p style="margin: 8px 0 0 0; font-size: 16px;"><strong>${totalCredits}</strong> / ${targetTotal} 학점</p>
            </div>

            <div class="summary-card ${isMajorPass ? 'pass' : 'fail'}">
                <strong>주전공 학점</strong>
                <span class="status-badge ${isMajorPass ? 'pass-text' : 'fail-text'}">${isMajorPass ? '✔ 충족' : '❌ 부족'}</span>
                <p style="margin: 8px 0 0 0; font-size: 16px;"><strong>${majorCredits}</strong> / ${targetMajor} 학점 이상</p>
            </div>

            <div class="summary-card ${isGeneralPass ? 'pass' : 'fail'}">
                <strong>교양 학점</strong>
                <span class="status-badge ${isGeneralPass ? 'pass-text' : 'fail-text'}">${isGeneralPass ? '✔ 충족' : '❌ 부족'}</span>
                <p style="margin: 8px 0 0 0; font-size: 16px;"><strong>${generalCredits}</strong> / ${targetGeneral} 학점 이상</p>
            </div>
        `;

        if (isSubMajorRequired) {
            summaryCardsHTML += `
                <div class="summary-card ${isSubMajorPass ? 'pass' : 'fail'}">
                    <strong>소단위전공 학점</strong>
                    <span class="status-badge ${isSubMajorPass ? 'pass-text' : 'fail-text'}">${isSubMajorPass ? '✔ 충족' : '❌ 부족'}</span>
                    <p style="margin: 8px 0 0 0; font-size: 16px;"><strong>${subMajorCredits}</strong> / ${targetSubMajor} 학점 이상</p>
                </div>
            `;
        }

        if (isTeaching) {
            summaryCardsHTML += `
                <div class="summary-card ${teachingPass ? 'pass' : 'fail'}">
                    <strong>교직 학점</strong>
                    <span class="status-badge ${teachingPass ? 'pass-text' : 'fail-text'}">${teachingPass ? '✔ 충족' : '❌ 부족'}</span>
                    <p style="margin: 8px 0 0 0; font-size: 16px;"><strong>${teachingCredits}</strong> / 21 학점 이상</p>
                </div>
            `;
        }

        const resultBox = document.getElementById('resultBox');
        const resultContent = document.getElementById('resultContent');
        const excelBtn = document.getElementById('excelBtn');

        resultBox.style.display = 'block';
        excelBtn.style.display = 'flex'; // 계산 완료 시 엑셀 다운로드 버튼 노출

        resultContent.innerHTML = `
            <p style="font-size: 13px; color: #555; margin-bottom: 15px;">
                총 <strong>${globalParsedRows.length}개</strong> 과목 분석 완료 (기준: ${college === 'edu' ? '사범대학' : '트리니티융합대학'}, ${admissionYear}학번, ${targetGrade}학년)
            </p>

            <div class="summary-grid">
                ${summaryCardsHTML}
            </div>

            <div class="requirement-box">
                <strong>📌 추가 필수 요건 검증</strong>
                <ul class="requirement-list">
                    <li>소단위전공 이수 대상: <span class="${isSubMajorRequired ? (isSubMajorPass ? 'pass-text' : 'fail-text') : ''}"><strong>${isSubMajorRequired ? (isSubMajorPass ? '충족 완료' : '학점 부족 (9학점 필요)') : '해당 없음'}</strong></span></li>
                    <li>교직 이수: <span class="${isTeaching ? (teachingPass ? 'pass-text' : 'fail-text') : ''}"><strong>${isTeaching ? (teachingPass ? '충족 (21학점 이상)' : '학점 부족 (21학점 필요)') : '해당 없음'}</strong></span></li>
                    <li>졸업 논문: <span class="${isThesisDone ? 'pass-text' : 'fail-text'}"><strong>${isThesisDone ? '제출 완료 (통과)' : '미제출 (필수)'}</strong></span></li>
                </ul>
            </div>
        `;
    }

    // SheetJS를 이용한 엑셀 파일 다운로드 함수
    function exportToExcel() {
        if (globalParsedRows.length === 0) {
            alert('먼저 졸업 학점 계산을 실행해주세요!');
            return;
        }

        // 워크시트 생성
        const worksheet = XLSX.utils.json_to_sheet(globalParsedRows);
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "성적분석내역");

        // 파일 다운로드 실행
        XLSX.writeFile(workbook, "CKU_Graduation_Credits.xlsx");
    }
</script>

</body>
</html>
