<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>가톨릭관동대학교 성적 엑셀 변환기</title>
    <!-- SheetJS (엑셀 다운로드용 라이브러리) -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx-js-style@1.2.0/dist/xlsx.bundle.js"></script>
    <style>
        :root {
            --primary: #003366;
            --primary-hover: #002244;
            --bg: #f4f6f9;
            --card-bg: #ffffff;
            --border: #dcdfe6;
            --text: #2c3e50;
            --text-light: #7f8c8d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            padding: 40px 20px;
        }

        .container {
            max-width: 850px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
        }
        /* 컨버터가 담겨 있는 최상단 부모 컨테이너의 제한을 풀어줌 */
        .grade-converter-wrapper, 
        .container, 
        .card {
            max-width: 100% !important; /* 폭 제한 해제 */
            width: 100% !important;
        }

        header {
            text-align: center;
            margin-bottom: 35px;
        }

        header h1 {
            color: var(--primary);
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 800;
        }

        header p {
            color: var(--text-light);
            font-size: 14px;
        }

        .step-section {
            background: #fafbfc;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 15px;
            border-bottom: 2px solid var(--primary);
            padding-bottom: 6px;
        }

        .form-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .form-row label.row-title {
            font-weight: 600;
            font-size: 14px;
            flex: 1.2;
        }

        .form-row .input-area {
            flex: 2.8;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        input[type="text"], select {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: #fff;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--primary);
        }

        .radio-group {
            display: flex;
            gap: 20px;
            font-size: 14px;
            cursor: pointer;
            align-items: center;
        }

        /* 학과 아래의 라디오 버튼 영역 스타일 */
        .form-check, label {
            white-space: nowrap; /* 글자가 강제로 개행되는 현상을 원천 차단합니다 */
        }

        textarea {
            width: 100%;
            height: 180px;
            padding: 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
            outline: none;
            background: #fff;
        }

        textarea:focus {
            border-color: var(--primary);
        }

        .btn-action {
            width: 100%;
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-top: 10px;
        }

        .btn-action:hover {
            background-color: var(--primary-hover);
        }

        .preview-box {
            margin-top: 25px;
            display: none;
            background: #fff;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
        }

        .preview-box h3 {
            font-size: 16px;
            color: var(--primary);
            margin-bottom: 10px;
        }
        /* 미리보기 박스 전체의 폭을 넓히고 여백을 넉넉하게 조정 */
        #previewSection {
            max-width: 100%;
            margin: 0 auto;
        }

        /* 테이블 감싸는 영역에 가로 스크롤을 부드럽게 넣어주면서 넉넉한 공간 확보 */
        #previewSection .table-responsive {
            width: 100%;
            overflow-x: auto; /* 가로가 좁을 때 스크롤이 생기도록 함 */
            background: #ffffff;
            padding: 15px;
            border-radius: 8px;
        }

        /* 미리보기 테이블 셀 스타일 (옹기종기한 느낌 해제) */
        #previewTableElement {
            width: 100%;
            white-space: nowrap; /* 텍스트가 제멋대로 줄바꿈되는 것을 방지하고 한 줄로 쫙 펴줌 */
        }

        /* 미리보기 테이블 셀 여백과 글자 크기를 컴팩트하게 축소 */
        #previewTableElement th, 
        #previewTableElement td {
            padding: 4px 8px !important;     /* 상하좌우 여백을 대폭 줄여서 촘촘하게 만듦 */
            font-size: 12px !important;     /* 글자 크기를 살짝 줄여서 한 화면에 더 많이 담기게 함 */
            white-space: nowrap;            /* 글자 꺾임 방지 */
        }

        /* 첫 번째 행(타이틀)만 살짝 여유 있게 유지 */
        #previewTableElement tr:first-child td {
            padding: 10px !important;
            font-size: 16px !important;
        }

        /* 테이블이 담긴 부모 박스의 여백도 정돈 */
        #previewSection .table-responsive {
            padding: 10px !important;
            background: #ffffff;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>가톨릭관동대학교 성적 엑셀 변환기</h1>
        <p>종합정보시스템 포맷과 동일한 구조의 성적 엑셀(.xlsx) 파일을 생성합니다.</p>
    </header>

    <!-- 1. 학적 정보 입력 -->
    <div class="step-section">
        <div class="section-title">1. 기본 학적 정보 입력</div>

        <div class="form-row">
            <label class="row-title" for="studentId">학번</label>
            <div class="input-area">
                <input type="text" id="studentId" placeholder="예: 20221397">
            </div>
        </div>

        <div class="form-row">
            <label class="row-title" for="studentName">성명</label>
            <div class="input-area">
                <input type="text" id="studentName" placeholder="예: 황인기">
            </div>
        </div>

        <div class="form-row">
            <label class="row-title" for="department">학과 (소속)</label>
            <div class="input-area">
                <input type="text" id="department" placeholder="예: 컴퓨터교육과">
                <div class="radio-group">
                    <label><input type="radio" name="deptType" value="주간" checked> 주간</label>
                    <label><input type="radio" name="deptType" value="야간"> 야간</label>
                </div>
            </div>
        </div>

        <div class="form-row">
            <label class="row-title" for="gradeLevel">학년</label>
            <div class="input-area">
                <select id="gradeLevel">
                    <option value="0" selected>학년을 선택해주세요.</option>
                    <option value="1">1학년</option>
                    <option value="2">2학년</option>
                    <option value="3">3학년</option>
                    <option value="4">4학년</option>
                </select>
            </div>
        </div>
    </div>

    <!-- 2. 성적 데이터 입력 -->
    <div class="step-section">
        <div class="section-title">2. 성적 데이터 입력</div>
        <p style="font-size: 13px; color: var(--text-light); margin-bottom: 10px;">
            종합정보시스템 성적 조회 화면의 전체 내용을 복사하여 아래에 붙여넣어 주세요.
        </p>
        <textarea id="rawGrades" placeholder="2022/1    교양필수    / 논리적사고와글쓰기    논리적사고와글쓰기    2    B+"></textarea>
        
    
        <!-- 1. 최상단 '성적표 미리보기 생성' 버튼 -->
        <div>
            <button id="downloadBtn" class="btn-action" onclick="handleDownloadWithLoading()">
                <span id="btnText">📊 성적표 미리보기 생성</span>
                <span id="loadingSpinner" class="spinner-border spinner-border-sm ms-2 d-none" role="status" aria-hidden="true"></span>
            </button>
        </div>

        <!-- 2. 미리보기 영역 (★핵심: style="display: none;"을 주어 처음엔 강제로 숨김) -->
        <div id="previewSection" class="mt-4" style="display: none;">
            <h4 class="mb-3">📊 성적표 데이터 미리보기</h4>
            <div class="table-responsive border rounded p-3 bg-white shadow-sm" style="max-height: 450px; overflow-y: auto;">
                <table id="previewTableElement" class="table table-bordered table-sm text-center align-middle" style="font-size: 13px;">
                    <!-- 자바스크립트로 동적 생성됨 -->
                </table>
            </div>
            <div class="mt-3">
                <!-- 최종 다운로드 버튼 -->
                <button class="btn-action" onclick="handleFinalExcelDownload()">
                    💾 엑셀 파일로 최종 다운로드
                </button>
            </div>
        </div>

    <div id="previewBox" class="preview-box">
        <h3>✅ 변환 완료</h3>
        <p id="previewText" style="font-size: 13px; color: #555;"></p>
    </div>
</div>

<script>    
    let currentExcelData = null; // 미리보기 데이터를 임시 저장할 변수

    // 1. [로딩 + 미리보기 생성 함수] (버튼을 누를 때 실행)
    function handleDownloadWithLoading() {
        const btn = document.getElementById('downloadBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('loadingSpinner');
        const previewSection = document.getElementById('previewSection');

        // 로딩 시작
        btn.disabled = true;
        btnText.textContent = "데이터 분석 및 미리보기 생성 중...";
        spinner.classList.remove('d-none');
        previewSection.style.display = 'none';

        const startTime = Date.now();

        setTimeout(() => {
            try {
                // ★ 기존 코드에서 데이터 파싱 및 excelData 배열을 만드는 핵심 로직을 가져왔습니다!
                let excelData = parseGradeDataToExcelArray();

                // 전역 변수에 저장
                currentExcelData = excelData;

                // 미리보기 테이블 렌더링
                renderPreviewTable(excelData);

            } catch (error) {
                console.error("미리보기 생성 중 오류 발생:", error);
                alert("데이터 파싱 중 문제가 발생했습니다. 입력 내용을 확인해주세요.");
            } finally {
                const elapsedTime = Date.now() - startTime;
                const remainingTime = Math.max(0, 1000 - elapsedTime); // 최소 1초 로딩 유지

                setTimeout(() => {
                    // 로딩 종료
                    btn.disabled = false;
                    btnText.textContent = "📊 성적표 미리보기 생성";
                    spinner.classList.add('d-none');

                    // 미리보기 영역 노출
                    previewSection.style.display = 'block';
                    previewSection.scrollIntoView({ behavior: 'smooth' });
                }, remainingTime);
            }
        }, 50);
    }


    // 2. [데이터 파싱 전용 함수] (위의 미리보기 함수에서 호출됨)
    function parseGradeDataToExcelArray() {
        const studentId = document.getElementById('studentId').value.trim();
        const studentName = document.getElementById('studentName').value.trim();
        const deptName = document.getElementById('department').value.trim();
        const deptType = document.querySelector('input[name="deptType"]:checked').value;
        const gradeLevel = document.getElementById('gradeLevel').value;
        const rawData = document.getElementById('rawGrades').value;

        if (!studentId || !studentName || !deptName) {
            throw new Error('학번, 성명, 학과 정보를 모두 입력해주세요!');
        }
        if (!rawData.trim()) {
            throw new Error('성적 데이터를 입력해주세요!');
        }

        let sumGeneral = 0, sumMajor = 0, sumTeaching = 0, sumDoubleMajor = 0;
        let sumMinor = 0, sumLinkedMajor = 0, sumSubMajor = 0, sumElective = 0, totalCredits = 0;
        let gradePointsSum = 0, gradedCreditsSum = 0;
        let detailRows = [];

        const knownAreas = ['인성', '학문도구', '기초', '융합', '소통', '자기관리', '정보활용', '창의융합', '문제해결', '공동체', '미래설계', '디지털융합', '지역혁신', '지속가능발전', '계열기초', '인문', '균형', '진로'];
        const knownTopics = ['논리적사고와글쓰기', '외국어', 'MSC교과', 'VERUM인성:그리스도교문화', 'VERUM인성', 'VERUM인간', '디지털소통', '디지털시대의사고와표현', '봉사활동', '진로탐색', '창의성', '창업', '정치와경제', '심리와건강', '정보와기술', '인간과문학', '역사와사회', '철학과예술', '자연과환경', '수리와과학', '언어와문화', '인간학'];

        const lines = rawData.split('\n');
        lines.forEach(line => {
            const cleanLine = line.trim().replace(/\s+/g, ' ');
            if (!cleanLine) return;
            const cols = cleanLine.split(' ');
            if (cols.length < 4) return;

            let semester = cols[0];
            let category = cols[1];
            let credit = 0;
            let grade = '';
            let creditIndex = -1;
        
            let subjectArea = "/";
            let subjectName = "";
            let detectedArea = "";
            let detectedTopic = "";
            let cleanWords = [];

            for (let i = cols.length - 1; i >= 2; i--) {
                let num = parseFloat(cols[i]);
                if (!isNaN(num) && (num === 0.5 || (num >= 1 && num <= 6))) {
                    credit = num;
                    creditIndex = i;
                    grade = cols[i + 1] || '';
                    break;
                }
            }

            if (credit === 0 && cleanLine.includes('0.5')) {
                credit = 0.5;
                grade = cols[cols.length - 1];
                creditIndex = cols.length - 2;
            }
            if (credit === 0) return;

            let middleParts = cols.slice(2, creditIndex);
            let isGeneralEdu = category.includes('교양');
            let contentWords = middleParts.filter(w => w !== '/');

            contentWords.forEach(word => {
                let cleanWord = word.trim();
                if (knownAreas.includes(cleanWord) && !detectedArea) {
                    detectedArea = cleanWord;
                } else if (isGeneralEdu && knownTopics.some(topic => cleanWord.includes(topic)) && !detectedTopic) {
                    detectedTopic = cleanWord;
                } else {
                    cleanWords.push(cleanWord);
                }
            });

            if (detectedArea && detectedTopic) {
                subjectArea = `${detectedArea} / ${detectedTopic}`;
            } else if (detectedArea) {
                subjectArea = detectedArea;
            } else if (detectedTopic) {
                subjectArea = `/ ${detectedTopic}`;
            }

            subjectName = cleanWords.join(' ');
            if (!subjectName.trim() && detectedTopic) {
                subjectName = detectedTopic;
            } else if (!subjectName.trim()) {
                subjectName = contentWords.join(' ');
            }

            let nameParts = subjectName.split(' ');
            if (nameParts.length >= 2 && nameParts[0] === nameParts[1]) {
                subjectName = nameParts[0];
            }

            let note = cols.slice(creditIndex + 2).join(' ');
            let isPass = (grade !== 'N' && grade !== 'F');

            if (category.includes('소단위전공')) { if (isPass) sumSubMajor += credit; }
            else if (category.includes('전공')) { if (isPass) sumMajor += credit; }
            else if (category.includes('교양')) { if (isPass) sumGeneral += credit; }
            else if (category.includes('교직')) { if (isPass) sumTeaching += credit; }
            else if (category.includes('복수')) { if (isPass) sumDoubleMajor += credit; }
            else if (category.includes('부전공')) { if (isPass) sumMinor += credit; }
            else if (category.includes('연계')) { if (isPass) sumLinkedMajor += credit; }
            else { if (isPass) sumElective += credit; }

            if (isPass) totalCredits += credit;

            let gp = getGradePoint(grade);
            if (gp >= 0 && isPass) {
                gradePointsSum += (gp * credit);
                gradedCreditsSum += credit;
            }

            detailRows.push({
                '이수학기': semester,
                '이수구분': category,
                '이수영역/주제': subjectArea,
                '교과목명': subjectName.trim() || '과목명 미확인',
                '학점': credit,
                '등급': grade,
                '비고': note
            });
        });

        let gpa = gradedCreditsSum > 0 ? (gradePointsSum / gradedCreditsSum).toFixed(3) : "0.000";

        let excelData = [
            [`${studentName}님의 전체 성적표`, "", "", "", "", "", "", ""],
            ["학번", studentId, "성명", studentName, "소속", `${deptName} ${deptType}`, "학년", `${gradeLevel}학년`],
            [],
            ["취득학점합계", "", "", "", "", "", "", "", "", "", ""],
            ["교양", "전공", "교직", "복수전공", "부전공", "연계전공", "소단위전공", "일반선택", "취득학점", "평점평균", "백분율"],
            [sumGeneral, sumMajor, sumTeaching, sumDoubleMajor, sumMinor, sumLinkedMajor, sumSubMajor, sumElective, totalCredits, gpa, "89.2"],
            [],
            ["성적내역", "", "", "", "", "", ""],
            ["이수학기", "이수구분", "이수영역/주제", "교과목명", "학점", "등급", "비고"]
        ];

        detailRows.forEach(row => {
            excelData.push([
                row['이수학기'], row['이수구분'], row['이수영역/주제'],
                row['교과목명'], row['학점'], row['등급'], row['비고']
            ]);
        });

        return excelData;
    }


    // 3. [웹 화면에 미리보기 표를 그려주는 함수]
    function renderPreviewTable(excelData) {
        const tableEl = document.getElementById('previewTableElement');
        if (!tableEl) return;
        tableEl.innerHTML = "";

        excelData.forEach((row, rowIndex) => {
            let tr = document.createElement('tr');

            if (rowIndex === 0 || rowIndex === 3 || rowIndex === 7) {
                tr.classList.add('table-secondary', 'fw-bold');
            } else if (rowIndex === 4 || rowIndex === 8) {
                tr.classList.add('table-light', 'fw-bold');
            }

            // ★ [핵심] 웹 미리보기에서는 엑셀 칸 맞춤용 연속된 빈 문자열("")들을 압축하거나 
            // 의미 없는 빈 칸을 제거하여 간격을 바짝 당겨줍니다.
            let filteredRow = row;

            // 2행(학적정보)이나 4~5행(학점합계)처럼 빈 칸이 대거 포함된 행들은 빈 값을 걸러내어 촘촘하게 배치
            if (rowIndex === 1 || rowIndex === 3 || rowIndex === 5) {
                // 값이 존재하는 유효한 데이터와 레이블만 남깁니다.
                filteredRow = row.filter((cell, idx) => {
                    // 빈 칸이면서 직전 칸도 빈 칸인 연속된 공백은 제거
                    return cell !== "" || (row[idx - 1] !== "" && row[idx + 1] !== "");
                });
            }

            row.forEach(cellValue => {
                let td = document.createElement('td');
                td.textContent = (cellValue !== undefined && cellValue !== null) ? cellValue : "";
                tr.appendChild(td);
            });

            tableEl.appendChild(tr);
        });
    }


    // 4. [최종 엑셀 다운로드 함수] (미리보기 하단의 '엑셀 파일로 최종 다운로드' 버튼을 누를 때 실행)
    function handleFinalExcelDownload() {
        if (!currentExcelData) {
            alert("다운로드할 데이터가 없습니다. 먼저 미리보기를 생성해주세요.");
            return;
        }

        try {
            // ★ 여기서부터는 작성해주셨던 화려한 엑셀 스타일링 및 파일 저장 로직이 그대로 실행됩니다!
            const worksheet = XLSX.utils.aoa_to_sheet(currentExcelData);

            if (!worksheet['!merges']) worksheet['!merges'] = [];
            worksheet['!merges'].push(
                { s: { r: 0, c: 0 }, e: { r: 0, c: 7 } },
                { s: { r: 3, c: 0 }, e: { r: 3, c: 10 } },
                { s: { r: 7, c: 0 }, e: { r: 7, c: 6 } }
            );

            if (worksheet['A1']) {
                worksheet['A1'].s = {
                    font: { name: "Malgun Gothic", sz: 20, bold: true },
                    alignment: { horizontal: "center", vertical: "center" }
                };
            }
            for (let col = 1; col <= 7; col++) {
                let cellRef = XLSX.utils.encode_cell({ r: 0, c: col });
                if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
                worksheet[cellRef].s = { alignment: { horizontal: "center", vertical: "center" } };
            }
            for (let col = 0; col <= 7; col++) {
                let cellRef = XLSX.utils.encode_cell({ r: 1, c: col });
                if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
                worksheet[cellRef].s = { ...(worksheet[cellRef].s || {}), alignment: { horizontal: "center", vertical: "center" } };
            }
            [0, 2, 4, 6].forEach(col => {
                let cellRef = XLSX.utils.encode_cell({ r: 1, c: col });
                if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
                worksheet[cellRef].s = { font: { name: "Malgun Gothic", sz: 11, bold: true }, alignment: { horizontal: "center", vertical: "center" } };
            });
            [1, 3, 5, 7].forEach(col => {
                let cellRef = XLSX.utils.encode_cell({ r: 1, c: col });
                if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
                worksheet[cellRef].s = { alignment: { horizontal: "center", vertical: "center" } };
            });

            if (worksheet['A4']) {
                worksheet['A4'].s = { font: { name: "Malgun Gothic", sz: 11, bold: true }, alignment: { horizontal: "center", vertical: "center" } };
            }
            for (let col = 1; col <= 10; col++) {
                let cellRef = XLSX.utils.encode_cell({ r: 3, c: col });
                if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
                worksheet[cellRef].s = { alignment: { horizontal: "center", vertical: "center" } };
            }
            for (let col = 0; col <= 10; col++) {
                let cellRef = XLSX.utils.encode_cell({ r: 4, c: col });
                if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
                worksheet[cellRef].s = { font: { name: "Malgun Gothic", sz: 11, bold: true }, alignment: { horizontal: "center", vertical: "center" } };
            }

            if (worksheet['A8']) {
                worksheet['A8'].s = { font: { name: "Malgun Gothic", sz: 11, bold: true }, alignment: { horizontal: "center", vertical: "center" } };
            }
            for (let col = 1; col <= 6; col++) {
                let cellRef = XLSX.utils.encode_cell({ r: 7, c: col });
                if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
                worksheet[cellRef].s = { alignment: { horizontal: "center", vertical: "center" } };
            }
            for (let col = 0; col <= 6; col++) {
                let cellRef = XLSX.utils.encode_cell({ r: 8, c: col });
                if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
                worksheet[cellRef].s = { font: { name: "Malgun Gothic", sz: 11, bold: true }, alignment: { horizontal: "center", vertical: "center" } };
            }

            worksheet['!rows'] = [{ hpt: 31.5 }];
            worksheet['!cols'] = [
                { wch: 12 }, { wch: 15 }, { wch: 29 }, { wch: 35 }, 
                { wch: 8 },  { wch: 20 },  { wch: 15 }
            ];

            const range = XLSX.utils.decode_range(worksheet['!ref']);
            for (let R = range.s.r; R <= range.e.r; ++R) {
                if (R === 2 || R === 6) continue;
                let maxColLimit = range.e.c; 
                if (R >= 0 && R <= 1) maxColLimit = 7;
                else if (R >= 3 && R <= 5) maxColLimit = 10;
                else if (R >= 7) maxColLimit = 6;

                for (let C = range.s.c; C <= maxColLimit; ++C) {
                    let cellRef = XLSX.utils.encode_cell({ r: R, c: C });
                    if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
                    worksheet[cellRef].s = worksheet[cellRef].s || {};

                    let topStyle = "thin", bottomStyle = "thin", leftStyle = "thin", rightStyle = "thin";
                    if (R >= 0 && R <= 1) {
                        topStyle = (R === 0) ? "medium" : "thin";
                        bottomStyle = (R === 1) ? "medium" : "thin";
                        leftStyle = (C === 0) ? "medium" : "thin";
                        rightStyle = (C === 7) ? "medium" : "thin";
                    } else if (R >= 3 && R <= 5) {
                        topStyle = (R === 3) ? "medium" : "thin";
                        bottomStyle = (R === 5) ? "medium" : "thin";
                        leftStyle = (C === range.s.c) ? "medium" : "thin";
                        rightStyle = (C === 10) ? "medium" : "thin";
                    } else if (R >= 7) {
                        topStyle = (R === 7 || R === 8) ? "medium" : "thin";
                        bottomStyle = (R === range.e.r) ? "medium" : "thin";
                        leftStyle = (C === range.s.c) ? "medium" : "thin";
                        rightStyle = (C === 6) ? "medium" : "thin";
                    }

                    worksheet[cellRef].s.border = {
                        top: { style: topStyle, color: { rgb: "000000" } },
                        bottom: { style: bottomStyle, color: { rgb: "000000" } },
                        left: { style: leftStyle, color: { rgb: "000000" } },
                        right: { style: rightStyle, color: { rgb: "000000" } }
                    };
                }
            }

            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "성적표");
            XLSX.writeFile(workbook, "종합정보_성적표.xlsx");

            alert("엑셀 파일이 성공적으로 다운로드되었습니다!");
        } catch (error) {
            console.error("엑셀 다운로드 오류:", error);
            alert("엑셀 파일 생성 중 오류가 발생했습니다.");
        }
    }
    function generateSchoolFormatExcel() {
        const studentId = document.getElementById('studentId').value.trim();
        const studentName = document.getElementById('studentName').value.trim();
        const deptName = document.getElementById('department').value.trim();
        const deptType = document.querySelector('input[name="deptType"]:checked').value;
        const gradeLevel = document.getElementById('gradeLevel').value;
        const rawData = document.getElementById('rawGrades').value;

        if (!studentId || !studentName || !deptName) {
            alert('학번, 성명, 학과 정보를 모두 입력해주세요!');
            return;
        }

        if (!rawData.trim()) {
            alert('성적 데이터를 입력해주세요!');
            return;
        }

        let sumGeneral = 0;       
        let sumMajor = 0;         
        let sumTeaching = 0;      
        let sumDoubleMajor = 0;   
        let sumMinor = 0;         
        let sumLinkedMajor = 0;   
        let sumSubMajor = 0;      
        let sumElective = 0;      
        let totalCredits = 0;     

        let gradePointsSum = 0;   
        let gradedCreditsSum = 0; 

        let detailRows = [];

        // 교양 및 주제별 키워드 매핑 사전
        // 1. 큰 이수영역 사전 (영역별 분류)
        const knownAreas = [
            '인성', '학문도구', '기초', '융합', '소통', '자기관리', 
            '정보활용', '창의융합', '문제해결', '공동체', '미래설계', 
            '디지털융합', '지역혁신', '지속가능발전', '계열기초', '인문', '균형', '진로'
        ];

        // 2. 세부 주제 사전 (주제 또는 과목명 관련 키워드)
        const knownTopics = [
            '논리적사고와글쓰기', '외국어', 'MSC교과', 'VERUM인성:그리스도교문화', 'MSC교과', 
            'VERUM인성', 'VERUM인간', '디지털소통', '디지털시대의사고와표현', '봉사활동', 
            '진로탐색', '창의성', '창업', '정치와경제', '심리와건강', 
            '정보와기술', '인간과문학', '역사와사회', '철학과예술', 
            '자연과환경', '수리와과학', '언어와문화', '봉사활동', '인간학'
        ];

        const lines = rawData.split('\n');
        lines.forEach(line => {
            const cleanLine = line.trim().replace(/\s+/g, ' ');
            if (!cleanLine) return;

            const cols = cleanLine.split(' ');
            if (cols.length < 4) return;

            let semester = cols[0]; 
            let category = cols[1]; 

            let credit = 0;
            let grade = '';
            let creditIndex = -1;
            
            // [안전한 선언] 변수들을 반복문 맨 위에 미리 선언하여 스코프/빨간 밑줄 오류 원천 차단
            let subjectArea = "/";
            let subjectName = "";
            let detectedArea = "";
            let detectedTopic = "";
            let cleanWords = [];

            // 뒤에서부터 학점(숫자) 위치 확정
            for (let i = cols.length - 1; i >= 2; i--) {
                let num = parseFloat(cols[i]);
                if (!isNaN(num) && (num === 0.5 || (num >= 1 && num <= 6))) {
                    credit = num;
                    creditIndex = i;
                    grade = cols[i + 1] || '';
                    break;
                }
            }

            if (credit === 0 && cleanLine.includes('0.5')) {
                credit = 0.5;
                grade = cols[cols.length - 1];
                creditIndex = cols.length - 2;
            }

            if (credit === 0) return;

            let middleParts = cols.slice(2, creditIndex);
            let isGeneralEdu = category.includes('교양');

            // 슬래시('/')를 제외한 순수 단어들만 먼저 추려냅니다.
            let contentWords = middleParts.filter(w => w !== '/');

            contentWords.forEach(word => {
                let cleanWord = word.trim();
                
                if (knownAreas.includes(cleanWord) && !detectedArea) {
                    detectedArea = cleanWord;
                } 
                else if (isGeneralEdu && knownTopics.some(topic => cleanWord.includes(topic)) && !detectedTopic) {
                    detectedTopic = cleanWord;
                } 
                else {
                    cleanWords.push(cleanWord);
                }
            });

            // 1. 이수영역/주제 조합 생성
            if (detectedArea && detectedTopic) {
                subjectArea = `${detectedArea} / ${detectedTopic}`;
            } else if (detectedArea) {
                subjectArea = detectedArea;
            } else if (detectedTopic) {
                subjectArea = `/ ${detectedTopic}`;
            } else {
                subjectArea = "/";
            }

            // 2. 과목명 조합 (중복 방지 및 스마트 폴백)
            subjectName = cleanWords.join(' ');

            // 만약 남은 단어가 없는데 감지된 주제(detectedTopic)가 있다면, 그 주제명이 곧 과목명이 됩니다.
            if (!subjectName.trim() && detectedTopic) {
                subjectName = detectedTopic;
            } else if (!subjectName.trim()) {
                subjectName = contentWords.join(' ');
            }

            // 혹시 모를 연속 중복 단어 방어 코드
            let nameParts = subjectName.split(' ');
            if (nameParts.length >= 2 && nameParts[0] === nameParts[1]) {
                subjectName = nameParts[0]; // 중복된 단어가 연속으로 나오면 하나만 채택
            }

            let note = cols.slice(creditIndex + 2).join(' ');
            let isPass = (grade !== 'N' && grade !== 'F');

            // 학점 누적 분류
            if (category.includes('소단위전공')) {
                if (isPass) sumSubMajor += credit;
            } else if (category.includes('전공')) {
                if (isPass) sumMajor += credit;
            } else if (category.includes('교양')) {
                if (isPass) sumGeneral += credit;
            } else if (category.includes('교직')) {
                if (isPass) sumTeaching += credit;
            } else if (category.includes('복수')) {
                if (isPass) sumDoubleMajor += credit;
            } else if (category.includes('부전공')) {
                if (isPass) sumMinor += credit;
            } else if (category.includes('연계')) {
                if (isPass) sumLinkedMajor += credit;
            } else {
                if (isPass) sumElective += credit;
            }

            if (isPass) totalCredits += credit;

            let gp = getGradePoint(grade);
            if (gp >= 0 && isPass) {
                gradePointsSum += (gp * credit);
                gradedCreditsSum += credit;
            }

            detailRows.push({
                '이수학기': semester,
                '이수구분': category,
                '이수영역/주제': subjectArea,
                '교과목명': subjectName.trim() || '과목명 미확인',
                '학점': credit,
                '등급': grade,
                '비고': note
            });
        });

        let gpa = gradedCreditsSum > 0 ? (gradePointsSum / gradedCreditsSum).toFixed(3) : "0.000";

        // 1. 기존 excelData의 맨 위에 타이틀 행을 추가합니다.
        let excelData = [
            [`${studentName}님의 전체 성적표`, "", "", "", "", "", "", ""], // 1행 (A1:H1 병합)
            ["학번", studentId, "성명", studentName, "소속", `${deptName} ${deptType}`, "학년", `${gradeLevel}학년`], // 2행
            [], // 3행 (빈 행 또는 간격 조정용)
            ["취득학점합계", "", "", "", "", "", "", "", "", "", ""], // 4행 (A4:K4 병합을 위한 빈 칸 포함)
            ["교양", "전공", "교직", "복수전공", "부전공", "연계전공", "소단위전공", "일반선택", "취득학점", "평점평균", "백분율"], // 5행 (학점 항목)
            [sumGeneral, sumMajor, sumTeaching, sumDoubleMajor, sumMinor, sumLinkedMajor, sumSubMajor, sumElective, totalCredits, gpa, "89.2"], // 6행 (학점 값)
            [], // 7행
            ["성적내역", "", "", "", "", "", ""], // 8행 (A8:G8 병합을 위한 빈 칸 포함)
            ["이수학기", "이수구분", "이수영역/주제", "교과목명", "학점", "등급", "비고"] // 9행 (성적 테이블 헤더)
        ];

        // 성적 상세 내역 추가
        detailRows.forEach(row => {
            excelData.push([
                row['이수학기'],
                row['이수구분'],
                row['이수영역/주제'],
                row['교과목명'],
                row['학점'],
                row['등급'],
                row['비고']
            ]);
        });

        const worksheet = XLSX.utils.aoa_to_sheet(excelData);

        // [1] 셀 병합 설정
        if (!worksheet['!merges']) worksheet['!merges'] = [];
        worksheet['!merges'].push(
            { s: { r: 0, c: 0 }, e: { r: 0, c: 7 } }, // 1행: A1 ~ H1 병합 (타이틀)
            { s: { r: 3, c: 0 }, e: { r: 3, c: 10 } }, // 4행: A4 ~ K4 병합 (취득학점합계)
            { s: { r: 7, c: 0 }, e: { r: 7, c: 6 } }   // 8행: A8 ~ G8 병합 (성적내역)
        );

        // [2] 1행 타이틀 스타일 (크기 20, 굵게, 가운데 정렬)
        if (worksheet['A1']) {
            worksheet['A1'].s = {
                font: { name: "Malgun Gothic", sz: 20, bold: true },
                alignment: { horizontal: "center", vertical: "center" }
            };
        }
        for (let col = 1; col <= 7; col++) {
            let cellRef = XLSX.utils.encode_cell({ r: 0, c: col });
            if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
            worksheet[cellRef].s = { alignment: { horizontal: "center", vertical: "center" } };
        }
        for (let col = 0; col <= 7; col++) {
            let cellRef = XLSX.utils.encode_cell({ r: 1, c: col }); // r: 1은 엑셀의 2행을 의미합니다.
            if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
            
            // 기존 셀 스타일 객체가 있다면 유지하고 alignment만 추가/덮어쓰기
            worksheet[cellRef].s = {
                ...(worksheet[cellRef].s || {}),
                alignment: { horizontal: "center", vertical: "center" }
            };
        }
        // [3] 2행(학적정보) 중 학번, 성명, 소속, 학년 라벨 셀(A, C, E, G열) 글자 굵게 및 가운데 정렬
        [0, 2, 4, 6].forEach(col => {
            let cellRef = XLSX.utils.encode_cell({ r: 1, c: col });
            if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
            worksheet[cellRef].s = {
                font: { name: "Malgun Gothic", sz: 11, bold: true },
                alignment: { horizontal: "center", vertical: "center" }
            };
        });
        // 2행의 나머지 값 셀들 가운데 정렬
        [1, 3, 5, 7].forEach(col => {
            let cellRef = XLSX.utils.encode_cell({ r: 1, c: col });
            if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
            worksheet[cellRef].s = { alignment: { horizontal: "center", vertical: "center" } };
        });

        // [4] 4행('취득학점합계') 스타일 (글자 굵게, 가운데 정렬)
        if (worksheet['A4']) {
            worksheet['A4'].s = {
                font: { name: "Malgun Gothic", sz: 11, bold: true },
                alignment: { horizontal: "center", vertical: "center" }
            };
        }
        for (let col = 1; col <= 10; col++) {
            let cellRef = XLSX.utils.encode_cell({ r: 3, c: col });
            if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
            worksheet[cellRef].s = { alignment: { horizontal: "center", vertical: "center" } };
        }

        // [5] 5행(학점 항목) 글자 굵게 및 가운데 정렬
        for (let col = 0; col <= 10; col++) {
            let cellRef = XLSX.utils.encode_cell({ r: 4, c: col });
            if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
            worksheet[cellRef].s = {
                font: { name: "Malgun Gothic", sz: 11, bold: true },
                alignment: { horizontal: "center", vertical: "center" }
            };
        }

        // [6] 8행('성적내역') 스타일 (글자 굵게, 가운데 정렬)
        if (worksheet['A8']) {
            worksheet['A8'].s = {
                font: { name: "Malgun Gothic", sz: 11, bold: true },
                alignment: { horizontal: "center", vertical: "center" }
            };
        }
        for (let col = 1; col <= 6; col++) {
            let cellRef = XLSX.utils.encode_cell({ r: 7, c: col });
            if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
            worksheet[cellRef].s = { alignment: { horizontal: "center", vertical: "center" } };
        }

        // [7] 9행(성적 헤더) 글자 굵게 및 가운데 정렬
        for (let col = 0; col <= 6; col++) {
            let cellRef = XLSX.utils.encode_cell({ r: 8, c: col });
            if (!worksheet[cellRef]) worksheet[cellRef] = { t: 's', v: '' };
            worksheet[cellRef].s = {
                font: { name: "Malgun Gothic", sz: 11, bold: true },
                alignment: { horizontal: "center", vertical: "center" }
            };
        }

        // 3. 행 높이 설정
        worksheet['!rows'] = [
            { hpt: 31.5 }, // 1행 높이
        ];

        // 4. 열 너비 설정
        worksheet['!cols'] = [
            { wch: 12 }, { wch: 15 }, { wch: 29 }, { wch: 35 }, 
            { wch: 8 },  { wch: 20 },  { wch: 15 }
        ];

        // [구역별 정밀 테두리 및 외곽선 적용]
        // 행 인덱스 기준:
        // - 타이틀 및 학적 정보: 행 0 ~ 1 (A1:H2)
        // - 취득학점 합계 영역: 행 3 ~ 5 (취득학점 테이블)
        // - 성적내역 테이블 영역: 행 7 ~ 끝 (성적 헤더 및 데이터)

       // [8] 구역별 정밀 테두리 적용 (성적 내역은 G열까지만 테두리 제한)
        // [구역별 정밀 테두리 및 외곽선 적용 - 빈 행 테두리 원천 차단]
        const range = XLSX.utils.decode_range(worksheet['!ref']);

        for (let R = range.s.r; R <= range.e.r; ++R) {
            // 3행(인덱스 2)과 7행(인덱스 6)은 완전히 빈 행이므로 테두리를 아예 그리지 않고 건너뜁니다!
            if (R === 2 || R === 6) continue;

            // 행(Row)별로 테두리를 칠할 최대 열(Column) 인덱스 지정
            let maxColLimit = range.e.c; 

            if (R >= 0 && R <= 1) {
                maxColLimit = 7; // 1~2행(타이틀, 학적정보): H열(7)까지만
            } else if (R >= 3 && R <= 5) {
                maxColLimit = 10; // 4~6행(취득학점 합계): K열(10)까지
            } else if (R >= 7) {
                maxColLimit = 6; // 8행 이상(성적내역): G열(6)까지만!
            }

            for (let C = range.s.c; C <= maxColLimit; ++C) {
                let cellRef = XLSX.utils.encode_cell({ r: R, c: C });
                if (!worksheet[cellRef]) {
                    worksheet[cellRef] = { t: 's', v: '' };
                }

                worksheet[cellRef].s = worksheet[cellRef].s || {};

                let topStyle = "thin", bottomStyle = "thin", leftStyle = "thin", rightStyle = "thin";

                // 구역 1: 타이틀 및 학적 정보 (행 0 ~ 1, A~H열)
                if (R >= 0 && R <= 1) {
                    topStyle = (R === 0) ? "medium" : "thin";
                    bottomStyle = (R === 1) ? "medium" : "thin";
                    leftStyle = (C === 0) ? "medium" : "thin";
                    rightStyle = (C === 7) ? "medium" : "thin";
                }
                // 구역 2: 취득학점 합계 테이블 (행 3 ~ 5, A~K열)
                else if (R >= 3 && R <= 5) {
                    topStyle = (R === 3) ? "medium" : "thin";
                    bottomStyle = (R === 5) ? "medium" : "thin";
                    leftStyle = (C === range.s.c) ? "medium" : "thin";
                    rightStyle = (C === 10) ? "medium" : "thin";
                }
                // 구역 3: 성적내역 테이블 제목 및 데이터 (행 8 ~ 끝, A~G열)
                else if (R >= 7) {
                    topStyle = (R === 7 || R === 8) ? "medium" : "thin";
                    bottomStyle = (R === range.e.r) ? "medium" : "thin";
                    leftStyle = (C === range.s.c) ? "medium" : "thin";
                    rightStyle = (C === 6) ? "medium" : "thin";
                }

                worksheet[cellRef].s.border = {
                    top: { style: topStyle, color: { rgb: "000000" } },
                    bottom: { style: bottomStyle, color: { rgb: "000000" } },
                    left: { style: leftStyle, color: { rgb: "000000" } },
                    right: { style: rightStyle, color: { rgb: "000000" } }
                };
            }
        }
        const workbook = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(workbook, worksheet, "성적조회");

        XLSX.writeFile(workbook, `CKU_Grade_Report_${studentName}.xlsx`);

        document.getElementById('previewBox').style.display = 'block';
        document.getElementById('previewText').innerText = `${studentName}님의 성적 데이터(${detailRows.length}과목)가 종합정보 포맷 엑셀 파일로 성공적으로 변환되었습니다!`;
    }

    function getGradePoint(grade) {
        switch(grade) {
            case 'A+': return 4.5;
            case 'A0': return 4.0;
            case 'B+': return 3.5;
            case 'B0': return 3.0;
            case 'C+': return 2.5;
            case 'C0': return 2.0;
            case 'D+': return 1.5;
            case 'D0': return 1.0;
            case 'F': 
            case 'N': return 0.0;
            default: return -1;
        }
    }
</script>
